  <title>Diesel — Fichaje</title>

  <style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0d1b2e;color:#e8f0fe;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;overscroll-behavior:none}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#0d1b2e}::-webkit-scrollbar-thumb{background:#1a6fd4;border-radius:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 18px;border-radius:10px;border:none;cursor:pointer;font-size:15px;font-weight:600;transition:all .2s;gap:8px;-webkit-user-select:none;user-select:none}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:#1a6fd4;color:#fff}.btn-primary:hover{background:#1557a8}
.btn-danger{background:#c0392b;color:#fff}.btn-ghost{background:transparent;color:#b0c8e0;border:1px solid #2a4a7a}
.btn-ghost:hover{background:#1a3260}.btn-success{background:#1e8449;color:#fff}.btn-full{width:100%}
input,select{background:#0a1628;border:1px solid #2a4a7a;color:#e8f0fe;padding:11px 14px;border-radius:8px;font-size:15px;width:100%;outline:none;transition:border-color .2s;-webkit-appearance:none}input[type=checkbox]{width:18px;height:18px;padding:0;border-radius:4px;accent-color:#1a6fd4;-webkit-appearance:auto;appearance:auto;cursor:pointer;flex-shrink:0}
input:focus,select:focus{border-color:#1a6fd4}input::placeholder{color:#4a6a9a}select option{background:#0a1628}
.card{background:#1a3260;border-radius:14px;padding:16px;border:1px solid #2a4a7a}
.label{font-size:13px;color:#7090b0;margin-bottom:5px;display:block}.field{margin-bottom:13px}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600}
.badge-green{background:#1a4a2e;color:#4ade80}.badge-red{background:#4a1a1a;color:#f87171}
.badge-yellow{background:#4a3a0a;color:#fbbf24}.badge-gray{background:#2a3a4a;color:#94a3b8}
.badge-blue{background:#1a2a5a;color:#7eb8f7}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;padding:9px 10px;color:#7090b0;border-bottom:1px solid #2a4a7a;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.table td{padding:9px 10px;border-bottom:1px solid #0d1b2e;vertical-align:middle}
.table tr:hover td{background:#142540}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0a1628;border-top:1px solid #2a4a7a;display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:100}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:9px 2px 7px;cursor:pointer;font-size:9px;color:#4a6a9a;gap:3px;border:none;background:transparent;transition:color .15s;line-height:1}
.nav-item.active{color:#1a6fd4}
.page{padding:16px;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px));max-width:800px;margin:0 auto}
.header{display:flex;align-items:center;gap:12px;padding:11px 16px;background:#0a1628;border-bottom:1px solid #2a4a7a;position:sticky;top:0;z-index:50}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:#1a3260;border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto;border:1px solid #2a4a7a}
.alert{padding:10px 13px;border-radius:10px;font-size:14px;margin-bottom:12px;display:flex;align-items:flex-start;gap:9px;line-height:1.4}
.alert-error{background:#4a1a1a;border:1px solid #c0392b;color:#f87171}
.alert-success{background:#1a4a2e;border:1px solid #1e8449;color:#4ade80}
.alert-warning{background:#4a3a0a;border:1px solid #f59e0b;color:#fbbf24}
.alert-info{background:#1a2a4a;border:1px solid #1a6fd4;color:#7eb8f7}
.spinner{width:34px;height:34px;border:3px solid #2a4a7a;border-top-color:#1a6fd4;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fichar-btn{width:168px;height:168px;border-radius:50%;border:4px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:all .3s;box-shadow:0 8px 32px rgba(0,0,0,.4);font-size:19px;font-weight:800;-webkit-user-select:none;user-select:none}
.fichar-btn.entrada{border-color:#4ade80;background:rgba(26,74,46,.85);color:#4ade80}
.fichar-btn.salida{border-color:#f87171;background:rgba(74,26,26,.85);color:#f87171}
.fichar-btn:hover{transform:scale(1.04)}.fichar-btn:active{transform:scale(.97)}.fichar-btn:disabled{opacity:.6;transform:none;cursor:wait}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.h1{font-size:22px;font-weight:800;margin-bottom:16px}.section-title{font-size:13px;font-weight:700;margin-bottom:9px;color:#b0c8e0;text-transform:uppercase;letter-spacing:.5px}
.text-muted{color:#7090b0}.text-sm{font-size:13px}.text-xs{font-size:11px}.overflow-x{overflow-x:auto;-webkit-overflow-scrolling:touch}p,span,div,td,th,li,h1,h2,h3,h4,label{color:inherit}.table td{color:#e8f0fe}.table th{color:#7090b0}
.mt-4{margin-top:16px}.mb-4{margin-bottom:16px}.mb-3{margin-bottom:12px}
.loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
@media(max-width:400px){.grid-2{grid-template-columns:1fr}}
  </style>

// ── UTILS ──────────────────────────────────────────────────────────────
const addZ = s => (typeof s === 'string' && !s.endsWith('Z') ? s + 'Z' : s);
const parseTs = v => {
  if (!v) return null;
  if (typeof v === 'string') return new Date(addZ(v));
  if (v && v._seconds) return new Date(v._seconds * 1000);
  return new Date(v);
};
const fmtDate = d => { const t = parseTs(d); return t ? t.toLocaleDateString('es-ES') : '-'; };
const fmtTime = d => { const t = parseTs(d); return t ? t.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}) : '-'; };
const fmtDT   = d => d ? `${fmtDate(d)} ${fmtTime(d)}` : '-';
const sameDay = (a, b) => { const da=parseTs(a),db=parseTs(b); return da&&db&&da.toLocaleDateString()===db.toLocaleDateString(); };
const hhmm = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;

// ── API ────────────────────────────────────────────────────────────────
const getTK  = () => localStorage.getItem('dsl_tk');
const setTK  = t  => localStorage.setItem('dsl_tk', t);
const getU   = () => { try { return JSON.parse(localStorage.getItem('dsl_u')); } catch { return null; } };
const saveU  = u  => localStorage.setItem('dsl_u', JSON.stringify(u));
const clearS = () => { localStorage.removeItem('dsl_tk'); localStorage.removeItem('dsl_u'); };

const api = async (method, path, body) => {
  const h = {'Content-Type':'application/json'};
  const tk = getTK();
  if (tk) h['Authorization'] = `Bearer ${tk}`;
  let r;
  try { r = await fetch(path, {method, headers:h, body: body ? JSON.stringify(body) : undefined}); }
  catch { throw new Error('Sin conexión con el servidor. Espera unos segundos e inténtalo de nuevo.'); }
  const ct = r.headers.get('content-type') || '';
  if (!ct.includes('application/json')) {
    if (r.status === 503 || r.status === 502) throw new Error('Servidor arrancando (plan gratuito Render). Espera 30-60 segundos e inténtalo de nuevo.');
    throw new Error(`Error ${r.status}: respuesta inesperada del servidor.`);
  }
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail || 'Error del servidor');
  return data;
};

// ── TAB FICHAR ──────────────────────────────────────────────────────────
function TabFichar() {
  const [fs,setFs]=useState([]); const [loading,setL]=useState(true);
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState(null);
  const [gps,setGps]=useState(null); const [gpsLoad,setGL]=useState(true);

  const load=async()=>{try{const d=await api('GET','/api/fichajes');setFs(d);}catch{}setL(false);};
  useEffect(()=>{
    load();
    if('geolocation'in navigator){
      navigator.geolocation.getCurrentPosition(
        p=>{setGps({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy});setGL(false);},
        ()=>setGL(false),{timeout:10000,enableHighAccuracy:true}
      );
    }else setGL(false);
  },[]);

  const ultimo=fs.length>0?fs[fs.length-1]:null;
  const dentro=ultimo?.tipo==='entrada';
  const proximo=dentro?'salida':'entrada';

  const hoy=fs.filter(f=>sameDay(f.ts,new Date()));
  let minHoy=0;
  for(let i=0;i<hoy.length-1;i+=2)
    if(hoy[i].tipo==='entrada'&&hoy[i+1]?.tipo==='salida')
      minHoy+=Math.round((parseTs(hoy[i+1].ts)-parseTs(hoy[i].ts))/60000);
  if(dentro&&hoy.length>0){const fe=hoy.filter(h=>h.tipo==='entrada').pop();if(fe)minHoy+=Math.round((Date.now()-parseTs(fe.ts))/60000);}

  const fichar=async()=>{
    setBusy(true);setMsg(null);
    try{const r=await api('POST','/api/fichar',gps||{});
      setMsg({t:'success',m:r.tipo==='entrada'?'✅ Entrada registrada':'🔴 Salida registrada'});
      await load();
    }catch(e){setMsg({t:'error',m:e.message});}finally{setBusy(false);}
  };

  if(loading)return <Spin full/>;
  return(
    <div className="page">
      <div className="h1">Fichar</div>
      {msg&&<Msg type={msg.t} msg={msg.m} onClose={()=>setMsg(null)}/>}
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:22,padding:'12px 0 24px'}}>
        <button className={`fichar-btn ${proximo}`} onClick={fichar} disabled={busy}>
          <Ic n={proximo==='entrada'?'check':'xmark'} sz={50}/>
          <span>{busy?'...':proximo==='entrada'?'ENTRADA':'SALIDA'}</span>
        </button>
        <div className="text-xs text-muted" style={{display:'flex',alignItems:'center',gap:5}}>
          <Ic n="loc" sz={13}/>
          {gpsLoad?'Obteniendo GPS…':gps?`GPS ±${Math.round(gps.acc)}m`:'Sin GPS'}
        </div>
      </div>
      <div className="grid-2" style={{marginBottom:12}}>
        <div className="card" style={{textAlign:'center'}}>
          <div className="label">Estado ahora</div>
          <span className={`badge ${dentro?'badge-green':'badge-gray'}`}>{dentro?'● Dentro':'○ Fuera'}</span>
        </div>
        <div className="card" style={{textAlign:'center'}}>
          <div className="label">Horas hoy</div>
          <div style={{fontSize:22,fontWeight:800}}>{hhmm(minHoy)}</div>
        </div>
      </div>
      {ultimo&&<div className="card">
        <div className="label">Último fichaje</div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span className={`badge ${ultimo.tipo==='entrada'?'badge-green':'badge-red'}`}>{ultimo.tipo}</span>
          <span style={{fontSize:14,color:'#b0c8e0'}}>{fmtDT(ultimo.ts)}</span>
        </div>
        {ultimo.ip&&<div className="text-xs text-muted" style={{marginTop:5}}>📡 {ultimo.ip}</div>}
      </div>}
    </div>
  );
}

// ── TAB SEMANAL ─────────────────────────────────────────────────────────
function TabSemanal() {
  const [fs,setFs]=useState([]); const [loading,setL]=useState(true); const [off,setOff]=useState(0);
  useEffect(()=>{api('GET','/api/fichajes').then(setFs).catch(()=>{}).finally(()=>setL(false));},[]);

  const days=()=>{
    const now=new Date(),day=now.getDay()||7,mon=new Date(now);
    mon.setDate(now.getDate()-day+1+off*7);
    return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
  };
  const D=days(); const NAMES=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const calcMin=dfs=>{
    let m=0;
    for(let i=0;i<dfs.length-1;i+=2)
      if(dfs[i].tipo==='entrada'&&dfs[i+1]?.tipo==='salida')
        m+=Math.round((parseTs(dfs[i+1].ts)-parseTs(dfs[i].ts))/60000);
    const last=dfs[dfs.length-1];
    if(last?.tipo==='entrada'&&sameDay(last.ts,new Date()))
      m+=Math.round((Date.now()-parseTs(last.ts))/60000);
    return m;
  };
  let tot=0;
  const rows=D.map((d,i)=>{const dfs=fs.filter(f=>sameDay(f.ts,d));const min=calcMin(dfs);tot+=min;return{d,name:NAMES[i],dfs,min};});

  if(loading)return <Spin full/>;
  return(
    <div className="page">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
        <div className="h1" style={{margin:0}}>Semana</div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <button className="btn btn-ghost" style={{padding:'5px 14px'}} onClick={()=>setOff(o=>o-1)}>‹</button>
          <span className="text-xs text-muted">{D[0].toLocaleDateString('es-ES',{day:'2-digit',month:'short'})} – {D[6].toLocaleDateString('es-ES',{day:'2-digit',month:'short'})}</span>
          <button className="btn btn-ghost" style={{padding:'5px 14px'}} onClick={()=>setOff(o=>o+1)} disabled={off>=0}>›</button>
        </div>
      </div>
      <div className="card" style={{textAlign:'center',marginBottom:14}}>
        <div className="label">Total semana</div>
        <div style={{fontSize:28,fontWeight:800}}>{hhmm(tot)}</div>
      </div>
      {rows.map(({d,name,dfs,min})=>{
        const isToday=sameDay(d,new Date()); const fut=d>new Date()&&!isToday;
        return(
          <div key={name} className="card" style={{marginBottom:9,opacity:fut?.5:1,borderColor:isToday?'#1a6fd4':undefined}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:dfs.length>0?9:0}}>
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <span style={{fontSize:15,fontWeight:700}}>{name}</span>
                <span className="text-xs text-muted">{d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'})}</span>
                {isToday&&<span className="badge badge-blue" style={{fontSize:10}}>Hoy</span>}
              </div>
              <span style={{fontWeight:800,color:min>0?'#e8f0fe':'#3a5a7a',fontSize:17}}>{min>0?hhmm(min):'--:--'}</span>
            </div>
            {dfs.map((fj,idx)=>(
              <div key={idx} style={{display:'flex',alignItems:'center',justifyContent:'space-between',fontSize:13,padding:'4px 0',borderTop:'1px solid #142540'}}>
                <span className={`badge ${fj.tipo==='entrada'?'badge-green':'badge-red'}`} style={{fontSize:11}}>{fj.tipo}</span>
                <span style={{color:'#b0c8e0'}}>{fmtTime(fj.ts)}</span>
              </div>
            ))}
          </div>
        );
      })}
    </div>
  );
}

// ── ADMIN DASHBOARD ─────────────────────────────────────────────────────
function AdminDashboard() {
  const [emps,setEmps]=useState([]); const [fs,setFs]=useState([]); const [loading,setL]=useState(true);
  const iRef=useRef(null);
  const load=async()=>{
    try{const [e,f]=await Promise.all([api('GET','/api/admin/empleados'),api('GET','/api/admin/fichajes')]);
      setEmps(e.filter(x=>x.active&&x.role==='employee'));setFs(f);}catch{}setL(false);
  };
  useEffect(()=>{load();iRef.current=setInterval(load,60000);return()=>clearInterval(iRef.current);},[]);

  const estado=uid=>{
    const uf=[...fs.filter(f=>f.uid===uid)].sort((a,b)=>parseTs(a.ts)-parseTs(b.ts));
    const ult=uf[uf.length-1];
    if(!ult)return{dentro:false,min:null,alerta:false,hoyMin:0,ulTs:null};
    const dentro=ult.tipo==='entrada';
    let minDentro=null; if(dentro)minDentro=Math.round((Date.now()-parseTs(ult.ts))/60000);
    const hoy=uf.filter(f=>sameDay(f.ts,new Date()));
    let hoyMin=0;
    for(let i=0;i<hoy.length-1;i+=2)
      if(hoy[i].tipo==='entrada'&&hoy[i+1]?.tipo==='salida')
        hoyMin+=Math.round((parseTs(hoy[i+1].ts)-parseTs(hoy[i].ts))/60000);
    if(dentro&&hoy.length>0){const fe=hoy.filter(h=>h.tipo==='entrada').pop();if(fe)hoyMin+=Math.round((Date.now()-parseTs(fe.ts))/60000);}
    return{dentro,min:minDentro,alerta:dentro&&minDentro>=480,hoyMin,ulTs:ult.ts};
  };

  const alertas=emps.filter(e=>estado(e.id).alerta);
  if(loading)return <Spin full/>;
  return(
    <div className="page">
      <div className="h1">Dashboard</div>
      {alertas.length>0&&<Msg type="warning" msg={`⚠️ ${alertas.map(e=>e.nombre).join(', ')} ${alertas.length===1?'lleva':'llevan'} más de 8h sin registrar salida`}/>}
      <div className="text-xs text-muted" style={{marginBottom:12}}>⟳ Auto-actualización 60s · {new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}</div>
      {emps.map(emp=>{
        const {dentro,min,alerta,hoyMin,ulTs}=estado(emp.id);
        return(
          <div key={emp.id} className="card" style={{marginBottom:9,borderColor:alerta?'#f59e0b':undefined}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
              <div>
                <div style={{fontWeight:700,fontSize:15}}>{emp.fullname}</div>
                <div className="text-xs text-muted">{emp.dept||'-'} · {emp.email}</div>
              </div>
              <div style={{textAlign:'right'}}>
                <span className={`badge ${dentro?(alerta?'badge-yellow':'badge-green'):'badge-gray'}`}>
                  {dentro?(alerta?'⚠️ Dentro':'● Dentro'):'○ Fuera'}
                </span>
                {hoyMin>0&&<div className="text-xs text-muted" style={{marginTop:4}}>{hhmm(hoyMin)} hoy</div>}
              </div>
            </div>
            {ulTs&&<div className="text-xs text-muted" style={{marginTop:6}}>
              Último fichaje: {fmtDT(ulTs)}{dentro&&min!==null?` · ${hhmm(min)} dentro`:''}
            </div>}
          </div>
        );
      })}
      {emps.length===0&&<div style={{textAlign:'center',color:'#3a5a7a',padding:40}}>Sin empleados activos</div>}
    </div>
  );
}

// ── ADMIN EMPLEADOS ─────────────────────────────────────────────────────
function AdminEmpleados() {
  const [emps,setEmps]=useState([]); const [loading,setL]=useState(true);
  const [modal,setModal]=useState(null); const [f,setF]=useState({});
  const [err,setErr]=useState(''); const [rstModal,setRst]=useState(null); const [rstPwd,setRstPwd]=useState('');

  const load=()=>api('GET','/api/admin/empleados').then(setEmps).catch(()=>{}).finally(()=>setL(false));
  useEffect(()=>{load();},[]);

  const openNew=()=>{setF({nombre:'',apellido:'',email:'',phone:'',dept:'',role:'employee',password:''});setErr('');setModal('new');};
  const openEdit=e=>{setF({nombre:e.nombre,apellido:e.apellido,email:e.email,phone:e.phone||'',dept:e.dept||'',role:e.role,active:e.active});setErr('');setModal(e);};
  const create=async()=>{
    if(!f.nombre||!f.apellido||!f.email||!f.password){setErr('Todos los campos son obligatorios');return;}
    try{await api('POST','/api/admin/empleados',f);load();setModal(null);}catch(e){setErr(e.message);}
  };
  const update=async()=>{try{await api('PUT',`/api/admin/empleados/${modal.id}`,f);load();setModal(null);}catch(e){setErr(e.message);};};
  const del=async e=>{
    if(!confirm(`¿Eliminar a ${e.fullname}? Se hará backup previo en OneDrive.`))return;
    try{await api('DELETE',`/api/admin/empleados/${e.id}`);load();}catch(er){alert(er.message);}
  };
  const resetPwd=async()=>{
    if(rstPwd.length<6){alert('Mínimo 6 caracteres');return;}
    try{await api('POST','/api/admin/reset-pwd',{userId:rstModal.id,newPassword:rstPwd});setRst(null);setRstPwd('');alert('Contraseña reseteada correctamente');}
    catch(e){alert(e.message);}
  };

  if(loading)return <Spin full/>;
  return(
    <div className="page">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
        <div className="h1" style={{margin:0}}>Empleados <span style={{fontSize:15,color:'#7090b0',fontWeight:400}}>({emps.length})</span></div>
        <button className="btn btn-primary" style={{padding:'8px 14px'}} onClick={openNew}><Ic n="plus" sz={18}/>Nuevo</button>
      </div>
      {emps.map(emp=>(
        <div key={emp.id} className="card" style={{marginBottom:9,opacity:emp.active?1:.6}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
            <div>
              <div style={{fontWeight:700,fontSize:15}}>{emp.fullname}</div>
              <div className="text-xs text-muted">{emp.loginKey}</div>
              <div className="text-xs text-muted">{emp.email}{emp.dept?` · ${emp.dept}`:''}</div>
            </div>
            <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
              <span className={`badge ${emp.active?'badge-green':'badge-red'}`}>{emp.active?'Activo':'Inactivo'}</span>
              <span className="badge badge-gray" style={{fontSize:10}}>{emp.role}</span>
            </div>
          </div>
          <div style={{display:'flex',gap:8,marginTop:11,flexWrap:'wrap'}}>
            <button className="btn btn-ghost" style={{fontSize:12,padding:'5px 11px'}} onClick={()=>openEdit(emp)}><Ic n="pencil" sz={14}/>Editar</button>
            <button className="btn btn-ghost" style={{fontSize:12,padding:'5px 11px'}} onClick={()=>{setRst(emp);setRstPwd('');}}><Ic n="key" sz={14}/>Contraseña</button>
            <button className="btn btn-danger" style={{fontSize:12,padding:'5px 11px'}} onClick={()=>del(emp)}><Ic n="trash" sz={14}/>Eliminar</button>
          </div>
        </div>
      ))}
      {emps.length===0&&<div style={{textAlign:'center',color:'#3a5a7a',padding:40}}>Sin empleados</div>}

      {modal&&<Modal title={modal==='new'?'Nuevo empleado':`Editar: ${modal.fullname||''}`} onClose={()=>setModal(null)}>
        {err&&<Msg msg={err} onClose={()=>setErr('')}/>}
        <div className="grid-2">
          <div className="field"><label className="label">Nombre *</label><input value={f.nombre||''} onChange={e=>setF({...f,nombre:e.target.value})}/></div>
          <div className="field"><label className="label">Apellido *</label><input value={f.apellido||''} onChange={e=>setF({...f,apellido:e.target.value})}/></div>
        </div>
        <div className="field"><label className="label">Email *</label><input type="email" value={f.email||''} onChange={e=>setF({...f,email:e.target.value})}/></div>
        <div className="field"><label className="label">Teléfono</label><input type="tel" value={f.phone||''} onChange={e=>setF({...f,phone:e.target.value})}/></div>
        <div className="field"><label className="label">Departamento</label><input value={f.dept||''} onChange={e=>setF({...f,dept:e.target.value})}/></div>
        <div className="field"><label className="label">Rol</label>
          <select value={f.role||'employee'} onChange={e=>setF({...f,role:e.target.value})}>
            <option value="employee">Empleado</option><option value="admin">Administrador</option>
          </select>
        </div>
        {modal==='new'?<div className="field"><label className="label">Contraseña temporal *</label><input type="password" value={f.password||''} onChange={e=>setF({...f,password:e.target.value})}/></div>
        :<div className="field"><label className="label">Estado</label>
          <select value={f.active?'1':'0'} onChange={e=>setF({...f,active:e.target.value==='1'})}>
            <option value="1">Activo</option><option value="0">Inactivo</option>
          </select>
        </div>}
        <button className="btn btn-primary btn-full" style={{marginTop:4}} onClick={modal==='new'?create:update}>
          {modal==='new'?'Crear empleado':'Guardar cambios'}
        </button>
      </Modal>}

      {rstModal&&<Modal title={`Reset contraseña: ${rstModal.fullname}`} onClose={()=>setRst(null)}>
        <div className="field"><label className="label">Nueva contraseña (mín. 6 caracteres)</label><input type="password" value={rstPwd} onChange={e=>setRstPwd(e.target.value)}/></div>
        <button className="btn btn-primary btn-full" style={{marginTop:4}} onClick={resetPwd}>Resetear contraseña</button>
      </Modal>}
    </div>
  );
}

// ── ADMIN FICHAJES ──────────────────────────────────────────────────────
function AdminFichajes() {
  const [fs,setFs]=useState([]); const [loading,setL]=useState(true); const [q,setQ]=useState('');
  const load=()=>api('GET','/api/admin/fichajes').then(setFs).catch(()=>{}).finally(()=>setL(false));
  useEffect(()=>{load();},[]);
  const del=async fj=>{
    const ts=parseTs(fj.ts),yrs=(Date.now()-ts)/(365.25*24*3600000);
    if(yrs<4){alert(`No se puede eliminar: solo ${yrs.toFixed(1)} años. Mínimo 4 (RDL 8/2019).`);return;}
    if(!confirm('¿Eliminar este fichaje?'))return;
    try{await api('DELETE',`/api/admin/fichajes/${fj.id}`);load();}catch(e){alert(e.message);}
  };
  const filtered=fs.filter(f=>!q||f.empleado?.toLowerCase().includes(q.toLowerCase())||fmtDT(f.ts).includes(q)||f.tipo.includes(q.toLowerCase()));
  if(loading)return <Spin full/>;
  return(
    <div className="page">
      <div className="h1">Fichajes</div>
      <input placeholder="Buscar empleado, fecha o tipo…" value={q} onChange={e=>setQ(e.target.value)} style={{marginBottom:10}}/>
      <div className="text-xs text-muted" style={{marginBottom:11}}>{filtered.length} de {fs.length} registros</div>
      <div className="overflow-x">
        <table className="table">
          <thead><tr><th>Empleado</th><th>Tipo</th><th>Fecha/Hora</th><th>IP</th><th></th></tr></thead>
          <tbody>
            {filtered.map(fj=>(
              <tr key={fj.id}>
                <td style={{fontWeight:500,maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{fj.empleado}</td>
                <td><span className={`badge ${fj.tipo==='entrada'?'badge-green':'badge-red'}`} style={{fontSize:11}}>{fj.tipo}</span></td>
                <td style={{color:'#b0c8e0',whiteSpace:'nowrap'}}>{fmtDT(fj.ts)}</td>
                <td className="text-xs text-muted">{fj.ip}</td>
                <td><button className="btn btn-danger" style={{fontSize:11,padding:'4px 8px'}} onClick={()=>del(fj)}><Ic n="trash" sz={13}/></button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {filtered.length===0&&<div style={{textAlign:'center',color:'#3a5a7a',padding:40}}>Sin registros</div>}
    </div>
  );
}

        {od?.connected&&<>
          <div className="label" style={{marginTop:16,marginBottom:8}}>Backups manuales</div>
          {[['daily','Diario (ayer)'],['monthly','Mensual (mes actual)'],['annual','Anual (año actual)'],['full','Completo (todos los datos)']].map(([tipo,label])=>(
            <button key={tipo} className="btn btn-ghost btn-full" style={{marginBottom:8}} onClick={()=>backup(tipo)} disabled={!!bkLoading}>
              <Ic n="cloud" sz={16}/>{bkLoading===tipo?'Subiendo…':label}
            </button>
          ))}
          <div className="text-xs text-muted" style={{marginTop:8}}>⏰ Auto: Diario 23:00 · Mensual 1º día 00:30 · Anual 1 ene 01:00</div>
        </>}
      </div>
    </div>
  );
}

// ── APP SHELL ───────────────────────────────────────────────────────────
const EMP_TABS=[{id:'fichar',label:'Fichar',n:'home'},{id:'semanal',label:'Semana',n:'calendar'},{id:'historial',label:'Historial',n:'list'},{id:'misdatos',label:'Mis datos',n:'user'},{id:'config',label:'Config',n:'cog'}];
const ADM_TABS=[{id:'dashboard',label:'Inicio',n:'dashboard'},{id:'empleados',label:'Empleados',n:'users'},{id:'fichajes',label:'Fichajes',n:'clock'},{id:'auditoria',label:'Auditoría',n:'shield'},{id:'config',label:'Config',n:'cog'}];

function AppShell({user,tabs,tab,setTab,onLogout,children}) {
  return(
    <div style={{minHeight:'100vh',background:'#0d1b2e'}}>
      <div className="header">
        <img src={LOGO_URL} alt="logo" style={{height:34}}/>
        <div style={{flex:1}}>
          <div style={{fontSize:14,fontWeight:700,color:'#e8f0fe'}}>{EMPRESA}</div>
          <div className="text-xs text-muted">{user.fullname||user.nombre} · {user.role==='admin'?'Administrador':'Empleado'}</div>
        </div>
        <button onClick={onLogout} style={{background:'none',border:'none',cursor:'pointer',color:'#7090b0',padding:8,lineHeight:0}} title="Cerrar sesión">
          <Ic n="logout" sz={20}/>
        </button>
      </div>
      <div>{children}</div>
      <div className="bottom-nav">
        {tabs.map(t=>(
          <button key={t.id} className={`nav-item ${tab===t.id?'active':''}`} onClick={()=>setTab(t.id)}>
            <Ic n={t.n} sz={22}/>{t.label}
          </button>
        ))}
      </div>
    </div>
  );
}

// ── APP ROOT ────────────────────────────────────────────────────────────
function App() {
  const [status,setStatus]=useState(null);
  const [user,setUser]=useState(null); const [tab,setTab]=useState('fichar');

  useEffect(()=>{
    api('GET','/api/status').then(r=>{
      if(!r.configured){setStatus('setup');return;}
      setStatus('login');
      const u=getU(); const tk=getTK();
      if(u&&tk){
        api('GET','/api/me').then(()=>{setUser(u);setTab(u.role==='admin'?'dashboard':'fichar');}).catch(()=>clearS());
      }
    }).catch(()=>setStatus('login'));
  },[]);

  const onLogin=u=>{setUser(u);setTab(u.role==='admin'?'dashboard':'fichar');};
  const onLogout=()=>{clearS();setUser(null);setTab('fichar');};

  if(status===null)return(
    <div className="loading-screen">
      <img src={LOGO_URL} alt="logo" style={{height:68}}/>
      <div className="spinner"/>
      <div className="text-sm text-muted">Cargando…</div>
    </div>
  );
  if(status==='setup')return <Setup onDone={()=>setStatus('login')}/>;
  if(!user)return <Login onLogin={onLogin}/>;
  if(user.firstLogin)return <ChangePass onDone={()=>{const u={...user,firstLogin:false};saveU(u);setUser(u);}}/>;

  const isAdmin=user.role==='admin';
  const tabs=isAdmin?ADM_TABS:EMP_TABS;
  const views=isAdmin?{
    dashboard:<AdminDashboard/>,empleados:<AdminEmpleados/>,
    fichajes:<AdminFichajes/>,auditoria:<AdminAuditoria/>,config:<AdminConfig/>
  }:{
    fichar:<TabFichar/>,semanal:<TabSemanal/>,
    historial:<TabHistorial/>,misdatos:<TabMisDatos/>,config:<TabConfigEmp/>
  };

  return(
    <AppShell user={user} tabs={tabs} tab={tab} setTab={setTab} onLogout={onLogout}>
      {views[tab]||views[isAdmin?'dashboard':'fichar']}
    </AppShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
